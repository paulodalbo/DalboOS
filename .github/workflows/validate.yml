name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check skills and templates
        run: node scripts/check-skills.mjs
      - name: Test the bundled scripts
        run: node --test tests/node/scripts.test.mjs
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin
        run: claude plugin validate .
      - name: Test the mod
        run: claude plugin test .
